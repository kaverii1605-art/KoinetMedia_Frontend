<div id="notificationContainer" class="notification-container"></div>

<div class="container ">
  <div class="row">

    <div class="sticky-top text-end">
      <button class="btn btn-warning rounded-3">
        Log Out
      </button>
    </div>

    <div class="text-center my-4">
      <p class="display-4 fw-bold text-dark">Create Article!</p>
    </div>

    <!-- Total Article Card -->
    <div class="col-lg-4 col-sm-12 mb-3">
      <div class="card rounded-4 border-0 shadow">
        <div class="card-body text-center">
          <h5 class="card-title">Total Articles</h5>

          <p class="card-text fs-1 fw-bold">
            {{ totalArticles || 'Loading...' }}
          </p>

          <a routerLink="/articles" class="viewblog">
            View All Articles
          </a>
        </div>
      </div>
    </div>

    <div class="col-lg-4 col-sm-12"></div>

    <!-- Action Buttons -->
    <div class="col-lg-4 col-sm-12 mb-3">
      <div class="action-buttons">

        <a class="btn btn-danger btn-lg rounded-5" routerLink="/addarticle">
          Add Article +
        </a>

        <div class="secondary-buttons">

          <a class="btn btn-warning btn-sm" routerLink="/addblog">
            Add Blog +
          </a>

          <a class="btn btn-warning btn-sm" routerLink="/addinfographics">
            Add Infographics +
          </a>

        </div>

      </div>
    </div>

  </div>
</div>

<div class="container mt-4">
  <div class="row">
    <div class="col-lg-12">

      <form (ngSubmit)="submitArticle()" #articleForm="ngForm">

        <!-- Title -->
        <div class="form-group">
          <label for="title">Title</label>

          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            [(ngModel)]="article.title"
            required
          />
        </div>

        <!-- Category -->
        <div class="form-group my-3">
          <label for="category" class="mb-1">Category</label>

          <select
            class="form-control"
            id="category"
            name="category"
            [(ngModel)]="article.category"
            required
          >
            <option value="">Select Category</option>

            <option *ngFor="let c of categories" [value]="c">
              {{ c }}
            </option>

          </select>
        </div>

        <!-- Image URL -->
        <div class="form-group my-3">
          <label for="imageUrl">Image URL</label>

          <input
            type="text"
            class="form-control"
            id="imageUrl"
            name="imageUrl"
            [(ngModel)]="article.imageUrl"
            required
          />
        </div>

        <!-- Content -->
        <div class="form-group my-3">
          <label for="content">Content</label>

          <textarea
            id="content"
            name="content"
            class="form-control"
            rows="10"
            [(ngModel)]="article.content"
            required
          >Create Your Article!</textarea>

        </div>

        <!-- Submit -->
        <div class="text-center my-2">

          <button
            type="submit"
            class="btn btn-danger w-25 rounded-5 btn-lg"
            [disabled]="articleForm.invalid"
          >
            Submit
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
