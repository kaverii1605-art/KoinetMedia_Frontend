<div id="notificationContainer" class="notification-container"></div>

<div class="container ">
  <div class="row">

    <div class="sticky-top text-end">
      <button class="btn btn-warning rounded-3" routerLink="/login">
        Log Out
      </button>
    </div>

    <div class="text-center my-4">
      <p class="display-4 fw-bold text-dark">Create Blog!</p>
    </div>

    <!-- Total Blog Card -->
    <div class="col-lg-4 col-sm-12 mb-3">
      <div class="card rounded-4 border-0 shadow">
        <div class="card-body text-center">
          <h5 class="card-title">Total Blog</h5>
          <p class="card-text fs-1 fw-bold">
  {{ totalBlogs || 'Loading...' }}
</p>
          <!-- <p class="card-text fs-1 fw-bold">Loading..</p> -->
          <a routerLink="/blog" class="viewblog">View All Blogs</a>
        </div>
      </div>
    </div>

    <div class="col-lg-4 col-sm-12"></div>

    <!-- Action Buttons -->
    <div class="col-lg-4 col-sm-12 mb-3">
      <div class="action-buttons">

        <a class="btn btn-danger btn-lg rounded-5" routerLink="/addblog">
          Add Blog +
        </a>

        <div class="secondary-buttons">
          <a class="btn btn-warning btn-sm" routerLink="/addinfographics">
            Add Infographics +
          </a>

          <a class="btn btn-warning btn-sm" routerLink="/addarticle">
            Add Article +
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<div class="container mt-4">
  <div class="row">
    <div class="col-lg-12">

      <form (ngSubmit)="submitBlog()" #blogForm="ngForm">

        <!-- Title -->
        <div class="form-group">
          <label for="title">Title</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            [(ngModel)]="blog.title"
            required
          />
        </div>

        <!-- Category -->
        <div class="form-group my-3">
          <label for="category" class="mb-1">Category</label>
          <select
            class="form-control"
            id="category"
            name="category"
            [(ngModel)]="blog.category"
            required
          >
            <option value="">Select Category</option>
            <option *ngFor="let c of categories" [value]="c">
              {{ c }}
            </option>
          </select>
        </div>

        <!-- Image URL -->
        <div class="form-group my-3">
          <label for="imageUrl">Image URL</label>
          <input
            type="text"
            class="form-control"
            id="imageUrl"
            name="imageUrl"
            [(ngModel)]="blog.imageUrl"
            required
          />
        </div>

        <!-- Content -->
        <div class="form-group my-3">
          <label for="content">Content</label>
          <textarea
            id="content"
            name="content"
            class="form-control"
            rows="10"
            [(ngModel)]="blog.content"
            required
          >Create Your Blog!</textarea>
        </div>

        <!-- Submit -->
        <div class="text-center my-2">
          <button
            type="submit"
            class="btn btn-danger w-25 rounded-5 btn-lg"
            [disabled]="blogForm.invalid"
          >
            Submit
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
