<div class="blog-details-page">

  <div *ngIf="!blog?.title" class="text-center py-5">
    <h3>Loading blog...</h3>
  </div>

  <ng-container *ngIf="blog?.title">

    <section class="blog-hero">
      <div class="container text-center">

        <h3 class="blog-title">{{ blog.title }}</h3>

        <p class="blog-date">
          <i class="bi bi-calendar3"></i>
          {{ blog.createdAt || blog.date | date:'mediumDate' }}
        </p>

        <span class="blog-category">{{ blog.category }}</span>

      </div>
    </section>

    <section class="container py-5">

      <div class="blog-image-wrapper">
        <img
          [src]="blog.imageUrl || blog.image || 'assets/images/default-blog.jpg'"
          [alt]="blog.title"
          class="blog-main-image"
        >
      </div>

      <div class="blog-content-box">

        <p class="blog-description">
          {{ blog.description || blog.shortDescription || '' }}
        </p>

        <div class="blog-content">
          {{ blog.content }}
        </div>

      </div>

      <div class="blog-navigation">
        <button class="nav-btn" (click)="prevBlog()" [disabled]="currentIndex <= 0">
          ← Previous Blog
        </button>

        <button class="nav-btn" (click)="nextBlog()" [disabled]="currentIndex >= blogs.length - 1">
          Next Blog →
        </button>
      </div>

    </section>

  </ng-container>

</div>
